<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Live Viewer</title>
  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    iframe {
      width: 90vw;
      max-width: 1200px;
      aspect-ratio: 16 / 9;
      border: 0;
    }
  </style>
</head>
<body>

<iframe
  src="https://www.youtube.com/embed/LX8tMt_MTwE?autoplay=1"
  allow="autoplay; encrypted-media; picture-in-picture"
  allowfullscreen>
</iframe>

</body>
</html>
